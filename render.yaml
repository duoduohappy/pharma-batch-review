services:
  - type: web
    name: pharma-batch-review
    runtime: node
    plan: free
    branch: main
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
